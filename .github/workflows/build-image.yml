name: Build Custom Gitea Image

on:
  push:
    branches:
      - "base/v*"
      - "perf/*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image_tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::12}"

          if [[ "${BRANCH}" == base/v* ]]; then
            VERSION="${BRANCH#base/v}"
            PRIMARY_TAG="${VERSION}-custom"
            LATEST_TAG="ghcr.io/${GITHUB_REPOSITORY_OWNER}/gitea:latest"
          else
            SAFE_BRANCH="$(echo "${BRANCH}" | tr '/_' '-' | tr -cd '[:alnum:].-')"
            PRIMARY_TAG="${SAFE_BRANCH}-${SHORT_SHA}"
            LATEST_TAG=""
          fi

          echo "primary_tag=${PRIMARY_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building image tag: ${PRIMARY_TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gitea:${{ steps.image_tags.outputs.primary_tag }}
            ${{ steps.image_tags.outputs.latest_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Custom Gitea with code search API
            org.opencontainers.image.version=${{ steps.image_tags.outputs.primary_tag }}
